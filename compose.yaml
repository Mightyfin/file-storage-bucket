services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: documents
      POSTGRES_USER: documents
      POSTGRES_PASSWORD: local-documents-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U documents -d documents"]
      interval: 3s
      timeout: 3s
      retries: 30
    volumes: [document-postgres-data:/var/lib/postgresql/data]

  migrate:
    build: .
    entrypoint: ["/document-migrate"]
    environment: &runtime
      DOCUMENT_ENVIRONMENT: sandbox
      DOCUMENT_HTTP_ADDRESS: ":8080"
      DOCUMENT_DATABASE_URL: postgres://documents:local-documents-only@postgres:5432/documents?sslmode=disable
      DOCUMENT_AUTH_MODE: oidc
      DOCUMENT_OIDC_ISSUER: http://127.0.0.1.nip.io:18081/realms/mightyfin-sandbox
      DOCUMENT_OIDC_AUDIENCE: mightyfin-document-sandbox
      DOCUMENT_PARTY_BASE_URL: http://host.docker.internal:18086
      DOCUMENT_PARTY_TOKEN_URL: http://127.0.0.1.nip.io:18081/realms/mightyfin-sandbox/protocol/openid-connect/token
      DOCUMENT_PARTY_CLIENT_ID: document-party-client
      DOCUMENT_PARTY_CLIENT_SECRET: local-document-party-change-me
      DOCUMENT_S3_ENDPOINT: http://host.docker.internal:18333
      DOCUMENT_S3_REGION: zm-lusaka-1
      DOCUMENT_S3_ACCESS_KEY: mightyfin-documents-local
      DOCUMENT_S3_SECRET_KEY: local-development-only-change-me
      DOCUMENT_S3_BUCKET: mightyfin-local-documents
    depends_on:
      postgres: {condition: service_healthy}

  api:
    build: .
    environment: *runtime
    ports: ["127.0.0.1:18088:8080"]
    extra_hosts: ["host.docker.internal:host-gateway", "127.0.0.1.nip.io:host-gateway"]
    depends_on:
      migrate: {condition: service_completed_successfully}

  clamav:
    image: clamav/clamav:1.5.3-debian13-slim
    volumes: [clamav-signatures:/var/lib/clamav]
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 60s

  scanner:
    build: .
    entrypoint: ["/document-scanner"]
    environment:
      <<: *runtime
      DOCUMENT_CLAM_ADDRESS: clamav:3310
    extra_hosts: ["host.docker.internal:host-gateway", "127.0.0.1.nip.io:host-gateway"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      clamav: {condition: service_healthy}

volumes:
  document-postgres-data: {}
  clamav-signatures: {}
